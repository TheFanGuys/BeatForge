<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FB-16 Rhythm Composer</title>
<style>
  :root{
    --led-off:#3a2410;--led:#ff9e2c;--led-hot:#ff3b30;
    --ink:#c7ccd4;--ink-dim:#7d8590;
    --groove:#101216;--pad-off:#1b1e24;--pad-on:#ff9e2c;--pad-on-2:#ffbe5c;
    --labelw:46px;--gap:3px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#0c0d10;color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased;}
  body{padding:env(safe-area-inset-top) 10px calc(env(safe-area-inset-bottom) + 14px);max-width:780px;margin:0 auto;}
  .machine{background:linear-gradient(180deg,#2a2e36,#1c1f25 60%,#15171c);
    border:1px solid #000;border-radius:16px;
    box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
    padding:14px 14px 18px;margin-top:12px;}
  .plate{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
    padding:2px 4px 12px;border-bottom:1px solid #000;margin-bottom:14px;}
  .name{display:flex;align-items:baseline;gap:10px;}
  .model{font-size:30px;font-weight:800;letter-spacing:-1px;color:#fff;text-shadow:0 1px 0 #000;}
  .sub{font-size:10px;letter-spacing:3px;color:var(--ink-dim);text-transform:uppercase;}
  .power{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:2px;color:var(--ink-dim);}
  .pwr-led{width:10px;height:10px;border-radius:50%;background:#3a0d0a;box-shadow:inset 0 0 3px #000;}
  .pwr-led.live{background:var(--led-hot);box-shadow:0 0 10px var(--led-hot),inset 0 0 2px #fff;}
  .transport{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px;}
  .play{appearance:none;border:1px solid #000;border-radius:10px;cursor:pointer;
    background:linear-gradient(180deg,#3a3f48,#22252c);color:#fff;font:inherit;font-weight:700;
    font-size:13px;letter-spacing:1px;padding:12px 18px;min-width:96px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 #000;}
  .play:active{transform:translateY(1px);box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}
  .play.on{background:linear-gradient(180deg,#ffb14a,#f08a13);color:#1a1205;
    box-shadow:0 0 16px rgba(255,158,44,.5),inset 0 1px 0 rgba(255,255,255,.4);}
  .tempo{display:flex;align-items:center;gap:8px;flex:1;min-width:170px;background:var(--groove);
    border:1px solid #000;border-radius:10px;padding:8px 12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);}
  .tempo label{font-size:9px;letter-spacing:2px;color:var(--ink-dim);}
  .bpm-val{font-size:18px;font-weight:800;color:var(--led);min-width:54px;text-shadow:0 0 8px rgba(255,158,44,.5);}
  .bpm-val small{font-size:9px;color:var(--ink-dim);text-shadow:none;letter-spacing:1px;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:4px;background:#000;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:linear-gradient(180deg,#fff,#bbb);border:1px solid #000;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.6);}
  .utils{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
  .btn{appearance:none;border:1px solid #000;border-radius:8px;cursor:pointer;
    background:linear-gradient(180deg,#31353d,#1f2229);color:var(--ink);font:inherit;font-size:10px;
    letter-spacing:1px;text-transform:uppercase;padding:9px 11px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 0 #000;}
  .btn:active{transform:translateY(1px);box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}
  .btn.warn{color:#ffb0aa;}
  .ledbar{display:grid;grid-template-columns:var(--labelw) repeat(16,1fr);gap:var(--gap);margin-bottom:6px;align-items:center;}
  .ledbar .spacer{grid-column:1;}
  .led{height:6px;border-radius:3px;background:var(--led-off);box-shadow:inset 0 0 2px #000;}
  .led.beat{background:#4a3015;}
  .led.lit{background:var(--led);box-shadow:0 0 9px var(--led),0 0 2px #fff;}
  .grid{display:flex;flex-direction:column;gap:var(--gap);}
  .row{display:grid;grid-template-columns:var(--labelw) repeat(16,1fr);gap:var(--gap);align-items:center;}
  .label{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--ink);text-align:left;padding:0 2px;
    cursor:pointer;user-select:none;border-right:1px solid #000;height:100%;display:flex;align-items:center;}
  .label.muted{color:#54585f;text-decoration:line-through;}
  .pad{aspect-ratio:1/1;border-radius:5px;background:var(--pad-off);border:1px solid #05060a;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04),inset 0 -2px 4px rgba(0,0,0,.5);
    transition:background .04s,box-shadow .04s;}
  .pad.grp{background:#22262e;}
  .pad.on{background:linear-gradient(180deg,var(--pad-on-2),var(--pad-on));border-color:#7a4d10;
    box-shadow:0 0 8px rgba(255,158,44,.45),inset 0 1px 0 rgba(255,255,255,.5);}
  .pad.col{outline:2px solid rgba(255,255,255,.85);outline-offset:-1px;}
  .pad.on.col{box-shadow:0 0 14px rgba(255,158,44,.9),inset 0 1px 0 rgba(255,255,255,.6);}
  .hint{font-size:9px;letter-spacing:1px;color:var(--ink-dim);text-align:center;margin-top:14px;
    text-transform:uppercase;line-height:1.6;}
  .hint b{color:var(--led);}
</style>
</head>
<body>
  <div class="machine">
    <div class="plate">
      <div class="name"><span class="model">FB-16</span><span class="sub">Rhythm&nbsp;Composer</span></div>
      <div class="power"><span>PWR</span><span class="pwr-led" id="pwr"></span></div>
    </div>
    <div class="transport">
      <button class="play" id="play">&#9654; PLAY</button>
      <div class="tempo">
        <label>TEMPO</label>
        <span class="bpm-val"><span id="bpm">120</span><small> BPM</small></span>
        <input type="range" id="tempo" min="60" max="180" value="120">
      </div>
    </div>
    <div class="utils" id="utils">
      <button class="btn" data-preset="fourfloor">House</button>
      <button class="btn" data-preset="boombap">Boom Bap</button>
      <button class="btn" data-preset="trap">Trap</button>
      <button class="btn" data-preset="rock">Rock</button>
      <button class="btn" data-preset="random">Surprise</button>
      <button class="btn warn" data-preset="clear">Clear</button>
    </div>
    <div class="ledbar" id="ledbar"><div class="spacer"></div></div>
    <div class="grid" id="grid"></div>
    <div class="hint">Tap <b>PLAY</b> to start sound &middot; tap pads to build a beat<br>Tap a <b>track name</b> to mute &middot; rotate phone for bigger pads</div>
  </div>

const STEPS = 16;
const TRACKS = [
  {id:'kick',name:'KICK'},{id:'snare',name:'SNR'},{id:'clap',name:'CLAP'},
  {id:'chh',name:'CHH'},{id:'ohh',name:'OHH'},{id:'tom',name:'TOM'},
  {id:'rim',name:'RIM'},{id:'cow',name:'COW'},
];
const GAINS = {kick:1.0,snare:0.9,clap:0.85,chh:0.7,ohh:0.6,tom:0.9,rim:0.8,cow:0.65};

let pattern = TRACKS.map(()=>new Array(STEPS).fill(false));
let muted   = TRACKS.map(()=>false);

/* ---------- build DOM ---------- */
const grid=document.getElementById('grid'), ledbar=document.getElementById('ledbar');
const padEls=TRACKS.map(()=>new Array(STEPS).fill(null)), leds=[];
for(let s=0;s<STEPS;s++){const d=document.createElement('div');d.className='led'+(s%4===0?' beat':'');ledbar.appendChild(d);leds.push(d);}
TRACKS.forEach((t,ti)=>{
  const row=document.createElement('div');row.className='row';row.dataset.track=ti;
  const lbl=document.createElement('div');lbl.className='label';lbl.textContent=t.name;
  lbl.addEventListener('click',()=>toggleMute(ti));row.appendChild(lbl);
  for(let s=0;s<STEPS;s++){
    const p=document.createElement('div');p.className='pad'+((Math.floor(s/4)%2===1)?' grp':'');
    p.dataset.t=ti;p.dataset.s=s;p.addEventListener('click',()=>toggleStep(ti,s));
    row.appendChild(p);padEls[ti][s]=p;
  }
  grid.appendChild(row);
});
function toggleStep(ti,si){pattern[ti][si]=!pattern[ti][si];padEls[ti][si].classList.toggle('on',pattern[ti][si]);}
function toggleMute(ti){
  muted[ti]=!muted[ti];
  grid.querySelector('.row[data-track="'+ti+'"] .label').classList.toggle('muted',muted[ti]);
}
function repaint(){TRACKS.forEach((t,ti)=>{for(let s=0;s<STEPS;s++)padEls[ti][s].classList.toggle('on',pattern[ti][s]);});}

/* ---------- audio (Web Audio API, no libraries) ---------- */
let ctx=null, master=null, buffers={}, kitLoaded=false;
function b64ToBuf(b64){const bin=atob(b64),len=bin.length,bytes=new Uint8Array(len);for(let i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);return bytes.buffer;}
function decode(buf){return new Promise((res,rej)=>{const p=ctx.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej);});}
async function loadKit(){
  await Promise.all(Object.keys(SAMPLES).map(async id=>{buffers[id]=await decode(b64ToBuf(SAMPLES[id]));}));
}
function unlock(){const b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0);}
function play(id,time){
  const b=buffers[id];if(!b)return;
  const src=ctx.createBufferSource();src.buffer=b;
  const g=ctx.createGain();g.gain.value=GAINS[id]||1;
  src.connect(g);g.connect(master);src.start(time);
}

/* ---------- scheduler (lookahead) ---------- */
let bpm=120,current16=0,nextNoteTime=0,isPlaying=false,timerID=null,lastDrawn=-1;
const drawQ=[],LOOKAHEAD=25,AHEAD=0.12;
function nextNote(){nextNoteTime+=(60/bpm)/4;current16=(current16+1)%STEPS;}
function scheduleStep(step,time){
  TRACKS.forEach((t,ti)=>{if(pattern[ti][step]&&!muted[ti])play(t.id,time);});
  drawQ.push({step,time});
}
function scheduler(){
  while(nextNoteTime<ctx.currentTime+AHEAD){scheduleStep(current16,nextNoteTime);nextNote();}
  timerID=setTimeout(scheduler,LOOKAHEAD);
}
function drawLoop(){
  let step=lastDrawn;
  while(drawQ.length&&drawQ[0].time<ctx.currentTime){step=drawQ.shift().step;}
  if(step!==lastDrawn){drawStep(step);lastDrawn=step;}
  if(isPlaying)requestAnimationFrame(drawLoop);
}
function drawStep(step){
  if(lastDrawn>=0){leds[lastDrawn].classList.remove('lit');TRACKS.forEach((t,ti)=>padEls[ti][lastDrawn].classList.remove('col'));}
  leds[step].classList.add('lit');
  TRACKS.forEach((t,ti)=>padEls[ti][step].classList.add('col'));
  document.getElementById('pwr').classList.toggle('live',step%4===0);
}
function clearPlayhead(){
  leds.forEach(l=>l.classList.remove('lit'));
  TRACKS.forEach((t,ti)=>padEls[ti].forEach(p=>p.classList.remove('col')));
  document.getElementById('pwr').classList.remove('live');lastDrawn=-1;
}

/* ---------- transport ---------- */
const playBtn=document.getElementById('play');
playBtn.addEventListener('click',async()=>{
  if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=0.9;master.connect(ctx.destination);}
  await ctx.resume();
  if(!kitLoaded){unlock();playBtn.textContent='LOADING…';await loadKit();kitLoaded=true;}
  if(isPlaying){
    isPlaying=false;clearTimeout(timerID);drawQ.length=0;clearPlayhead();
    playBtn.classList.remove('on');playBtn.textContent='\u25B6 PLAY';
  }else{
    current16=0;lastDrawn=-1;nextNoteTime=ctx.currentTime+0.06;isPlaying=true;
    scheduler();requestAnimationFrame(drawLoop);
    playBtn.classList.add('on');playBtn.textContent='\u25A0 STOP';
  }
});

/* ---------- tempo ---------- */
const tempo=document.getElementById('tempo'),bpmLabel=document.getElementById('bpm');
tempo.addEventListener('input',()=>{bpm=+tempo.value;bpmLabel.textContent=tempo.value;});

/* ---------- presets ---------- */
function setRow(id,steps){const ti=TRACKS.findIndex(t=>t.id===id);steps.forEach(s=>pattern[ti][s]=true);}
const PRESETS={
  fourfloor(){setRow('kick',[0,4,8,12]);setRow('clap',[4,12]);setRow('chh',[2,6,10,14]);setRow('ohh',[2,6,10,14]);},
  boombap(){setRow('kick',[0,3,10]);setRow('snare',[4,12]);setRow('chh',[0,2,4,6,8,10,12,14]);setRow('ohh',[7,15]);},
  trap(){setRow('kick',[0,6,7,10]);setRow('clap',[8]);setRow('chh',[0,1,2,3,4,5,6,8,9,10,11,12,13,14,15]);setRow('ohh',[7]);},
  rock(){setRow('kick',[0,8,10]);setRow('snare',[4,12]);setRow('chh',[0,2,4,6,8,10,12,14]);},
  random(){TRACKS.forEach((t,ti)=>{const d=ti<3?0.22:0.4;for(let s=0;s<STEPS;s++)pattern[ti][s]=Math.random()<d;});},
  clear(){pattern=TRACKS.map(()=>new Array(STEPS).fill(false));}
};
document.getElementById('utils').addEventListener('click',e=>{
  const key=e.target.dataset.preset;if(!key)return;
  if(key!=='clear'&&key!=='random')pattern=TRACKS.map(()=>new Array(STEPS).fill(false));
  PRESETS[key]();repaint();
});

PRESETS.fourfloor();repaint();
</script>
